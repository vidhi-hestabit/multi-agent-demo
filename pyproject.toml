[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multi-agent-ai-system"
version = "1.0.0"
description = "Production-ready multi-agent AI system with A2A and MCP protocols"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    # Web framework
    "fastapi==0.115.0",
    "uvicorn[standard]==0.29.0",
    "httpx==0.27.0",
    # Config / validation
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv==1.0.1",
    # LLM
    "groq==0.9.0",
    # MCP
    "mcp==1.6.0",
    # Async
    "anyio>=4.6.0",
    "asyncio-atexit==1.0.1",
    # Utilities
    "python-dateutil==2.9.0",
    "tenacity==8.3.0",
    "structlog==24.2.0",
    # Email
    "aiosmtplib==3.0.1",
    "gradio>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "respx==0.21.1",
    "ruff==0.4.9",
]
otel = [
    "opentelemetry-sdk==1.25.0",
    "opentelemetry-exporter-otlp==1.25.0",
    "opentelemetry-instrumentation-fastapi==0.46b0",
]

[project.scripts]
mcp-server     = "mcp_server.main:main"
news-agent     = "agents.news_agent.main:main"
weather-agent  = "agents.weather_agent.main:main"
report-agent   = "agents.report_agent.main:main"
orchestrator   = "orchestrator.main:main"
ui             = "ui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["common", "mcp_server", "agents", "orchestrator", "ui"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.uv]
dev-dependencies = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "respx==0.21.1",
    "ruff==0.4.9",
]
