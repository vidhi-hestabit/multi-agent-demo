[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multi-agent-ai-system"
version = "1.0.0"
description = "Production-ready multi-agent AI system with A2A and MCP protocols"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    # Web framework
    "fastapi>=0.118",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    # Config / validation
    "pydantic>=2.8",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    # LLM
    "groq>=0.9",
    # MCP
    "mcp>=1.0",
    # Async
    "anyio>=4.6",
    "asyncio-atexit>=1.0",
    # Utilities
    "python-dateutil>=2.9",
    "tenacity>=8.3",
    "structlog>=24",
    # Email
    "aiosmtplib>=3.0",
    # UI
    "gradio>=4.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4"
]

otel = [
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0"
]

[project.scripts]
mcp-server     = "mcp_server.main:main"
news-agent     = "agents.news_agent.main:main"
weather-agent  = "agents.weather_agent.main:main"
report-agent   = "agents.report_agent.main:main"
orchestrator   = "orchestrator.main:main"
ui             = "ui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["common", "mcp_server", "agents", "orchestrator", "ui"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff"
]
